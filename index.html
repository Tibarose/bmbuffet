<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Order hot drinks, cold drinks, and snacks from the Banque Misr buffet.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF7043">
  <!-- PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BM Buffet">
  <link rel="apple-touch-icon" href="/bmbuffet/icons/Icon-192.png">
  <base href="/bmbuffet/">
  <link rel="icon" type="image/png" href="/bmbuffet/favicon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <title>BM Buffet</title>
  <link rel="manifest" href="/bmbuffet/manifest.json">
  <script src="/bmbuffet/notification_helper.js" defer></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background-color: #1A1A1A;
      font-family: 'Cairo', sans-serif;
    }

    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #FF7043 0%, #FF8A65 40%, #FFD54F 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1s ease-out;
      overflow: hidden;
    }

    .splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      width: 320px;
      height: 320px;
      animation: bounceIn 1.5s ease-out, pulse 3s infinite ease-in-out 1.5s;
      z-index: 2;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      box-sizing: border-box;
    }

    .text-container {
      text-align: center;
      margin-top: 30px;
      z-index: 2;
    }

    .app-name {
      font-size: 48px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideUp 1s ease-out 0.8s forwards;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .tagline {
      font-size: 20px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 12px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideUp 1s ease-out 1s forwards;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .developer-credit {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideUp 1s ease-out 1.2s forwards;
    }

    .loader {
      position: absolute;
      bottom: 60px;
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #FFFFFF;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
      z-index: 2;
    }

    .background-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      animation: floatShape 12s infinite ease-in-out, fadeInShape 1s ease-out;
    }

    .shape:nth-child(1) {
      width: 250px;
      height: 250px;
      top: -80px;
      left: -60px;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 180px;
      height: 180px;
      bottom: -50px;
      right: -40px;
      animation-delay: 3s;
    }

    .shape:nth-child(3) {
      width: 120px;
      height: 120px;
      top: 10%;
      left: 75%;
      animation-delay: 6s;
    }

    .shape:nth-child(4) {
      width: 150px;
      height: 150px;
      bottom: 20%;
      left: 10%;
      animation-delay: 9s;
    }

    /* Animations */
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes fadeSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes floatShape {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(25px, -25px) rotate(15deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes fadeInShape {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .logo-container { width: 220px; height: 220px; }
      .app-name { font-size: 32px; letter-spacing: 1px; }
      .tagline { font-size: 16px; }
      .developer-credit { font-size: 14px; }
      .loader { width: 50px; height: 50px; bottom: 40px; }
      .shape:nth-child(1) { width: 180px; height: 180px; }
      .shape:nth-child(2) { width: 120px; height: 120px; }
      .shape:nth-child(3) { width: 80px; height: 80px; }
      .shape:nth-child(4) { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>
<div id="splash-screen" class="splash-screen">
  <div class="background-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <div class="logo-container">
    <img src="/bmbuffet/icons/Icon-192.png" alt="BM Buffet Logo" class="logo" />
  </div>
  <div class="text-container">
    <p id="app-name" class="app-name">BM Buffet</p>
    <p id="tagline" class="tagline">Your Ultimate Buffet Experience</p>
    <p id="developer-credit" class="developer-credit">Developed by Mohamed Nazmy</p>
  </div>
  <div class="loader"></div>
</div>

<script>
  let deferredPrompt;
  let isPromptAvailable = false;

  window.addEventListener('beforeinstallprompt', (e) => {
    console.log('beforeinstallprompt event fired');
    e.preventDefault();
    deferredPrompt = e;
    isPromptAvailable = true;
    if (window.FlutterChannel) {
      window.FlutterChannel.postMessage('promptAvailable');
    }
  });

  function showInstallPrompt() {
    if (!deferredPrompt || !isPromptAvailable) {
      console.log('No deferred prompt available');
      return;
    }
    const userChoice = confirm("Would you like to install BM Buffet on your device for a better experience?");
    if (userChoice) {
      console.log('User clicked OK to install');
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') {
          console.log('User accepted the install prompt');
        } else {
          console.log('User dismissed the install prompt');
        }
        deferredPrompt = null;
        isPromptAvailable = false;
      });
    } else {
      console.log('User canceled the install prompt');
    }
  }

  window.triggerInstallPrompt = function() {
    console.log('triggerInstallPrompt called from Flutter');
    showInstallPrompt();
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/bmbuffet/flutter_service_worker.js')
        .then(reg => console.log('Service Worker registered:', reg))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }

  window.addEventListener('flutter-first-frame', () => {
    document.getElementById('splash-screen').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('splash-screen').style.display = 'none';
    }, 1000);
  });

  window.addEventListener('load', () => {
    const savedLocale = localStorage.getItem('locale') || 'ar';
    const appName = document.getElementById('app-name');
    const tagline = document.getElementById('tagline');
    const developerCredit = document.getElementById('developer-credit');
    if (savedLocale === 'ar') {
      appName.style.direction = 'rtl';
      appName.textContent = 'بي إم بوفيه';
      tagline.style.direction = 'rtl';
      tagline.textContent = 'تجربة البوفيه المثالية';
      developerCredit.style.direction = 'rtl';
      developerCredit.textContent = 'تم التطوير بواسطة محمد نظمي';
    } else {
      appName.style.direction = 'ltr';
      appName.textContent = 'BM Buffet';
      tagline.style.direction = 'ltr';
      tagline.textContent = 'Your Ultimate Buffet Experience';
      developerCredit.style.direction = 'ltr';
      developerCredit.textContent = 'Developed by Mohamed Nazmy';
    }
  });
</script>
<script src="/bmbuffet/flutter_bootstrap.js" async></script>
</body>
</html>
